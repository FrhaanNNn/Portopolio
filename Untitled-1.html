<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solution Page</title>
  <link rel="stylesheet" href="bootstrap.min.css" />
  <link rel="stylesheet" href="solution.css" />
</head>
<body>
  <div class="container mt-5">
    <div class="text-center">
      <h1 class="mb-4">Our Solution</h1>
      <p class="lead">
        Our product is a camera-based solution to help people reduce their smartphone usage.
        Unlike software apps that users can bypass, our physical solution gently reminds and motivates people 
        to stay focused in the real world.
      </p>
      <img src="dog-img.jpg" class="img-fluid my-4 rounded" alt="Friendly Dog" />
    </div>

    <div class="text-center my-5">
      <h3>Covered By</h3>
      <div class="d-flex justify-content-center flex-wrap align-items-center gap-4 mt-3">
        <img src="techcrunch.png" alt="TechCrunch" class="news-logo" />
        <img src="bizinsider.png" alt="Business Insider" class="news-logo" />
        <img src="mashable.png" alt="Mashable" class="news-logo" />
        <img src="tnw.png" alt="TNW" class="news-logo" />
      </div>
    </div>

    <div class="text-center mt-5">
      <img src="iphone.png" alt="iPhone with App" class="img-fluid" />
    </div>
  </div>
</body>
</html>
